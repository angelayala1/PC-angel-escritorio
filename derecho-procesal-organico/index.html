<title>Mapa Procesal Orgánico</title>
<meta name="description" content="Explorador interactivo de Derecho Procesal Orgánico chileno: elige un tema en el anillo y abre cada concepto con su definición, doctrina y normas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{
  --paper:#F4EEDF; --surface:#FAF6EC; --sunk:#ECE4D1; --ink:#2B2A26; --muted:#6F6857; --faint:#A39B88; --line:#DDD3BD;
  --blue:#2F5A8C; --blue-soft:#E2E3DD; --red:#A23A26; --red-soft:#F2DDCF; --on-accent:#FBF7EE;
  --cpr:#A23A26; --cpr-bg:#F2DDCF; --cot:#2F5A8C; --cot-bg:#DFE2DF; --cpc:#3A6A4A; --cpc-bg:#DDE8D6;
  --cc:#674592; --cc-bg:#E8DDE6; --pp:#86560F; --pp-bg:#F0E0C2; --oth:#5E5A50; --oth-bg:#E8E1D0;
  --serif:"Instrument Serif","Iowan Old Style",Georgia,serif; --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#1B1915; --surface:#23201B; --sunk:#141310; --ink:#E9E3D6; --muted:#A79F8E; --faint:#6F685B; --line:#38332B;
  --blue:#93B0D6; --blue-soft:#2A2E33; --red:#E3826C; --red-soft:#3A201B; --on-accent:#1B1915;
  --cpr:#E3826C; --cpr-bg:#3A201B; --cot:#93B0D6; --cot-bg:#2A2E33; --cpc:#8CC7A2; --cpc-bg:#172A1F;
  --cc:#C3A7E8; --cc-bg:#2A2138; --pp:#E5BD78; --pp-bg:#322612; --oth:#BDB5A4; --oth-bg:#2C2922;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#1B1915; --surface:#23201B; --sunk:#141310; --ink:#E9E3D6; --muted:#A79F8E; --faint:#6F685B; --line:#38332B;
  --blue:#93B0D6; --blue-soft:#2A2E33; --red:#E3826C; --red-soft:#3A201B; --on-accent:#1B1915;
  --cpr:#E3826C; --cpr-bg:#3A201B; --cot:#93B0D6; --cot-bg:#2A2E33; --cpc:#8CC7A2; --cpc-bg:#172A1F;
  --cc:#C3A7E8; --cc-bg:#2A2138; --pp:#E5BD78; --pp-bg:#322612; --oth:#BDB5A4; --oth-bg:#2C2922;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1480px;margin:0 auto;padding-inline:24px;padding-block:14px 0;display:flex;flex-direction:column;gap:10px}
.row1{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--serif);font-size:2rem;line-height:1;letter-spacing:-.01em}
.brand h1 i{color:var(--blue)}
.search{position:relative;flex:0 1 320px}
.search input{width:100%;font:inherit;font-size:.9rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px 10px 8px 32px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);fill:none}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:0 12px 32px rgba(0,0,0,.14);max-height:60vh;overflow:auto;z-index:5}
.results button{display:grid;grid-template-columns:1fr auto;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--blue-soft)}
.results b{font-weight:500}
.results span{font-family:var(--mono);font-size:.68rem;color:var(--muted);letter-spacing:.08em}
.results p{margin:0;padding:12px;color:var(--muted);font-size:.88rem}
.row2{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.tab:hover{color:var(--ink)}
.filters{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding-bottom:8px}
.filters .eyebrow{margin-right:4px}
.fbtn{border:1px solid var(--line);background:transparent;border-radius:3px;padding:2px 8px;font-family:var(--mono);font-size:.7rem;font-weight:600;cursor:pointer;color:var(--muted)}
.fbtn[aria-pressed="true"]{background:var(--c-bg);color:var(--c);border-color:var(--c)}

/* ---------- layout ---------- */
.wrap{max-width:1480px;margin:0 auto;padding-inline:24px;padding-block:22px 48px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:28px;align-items:start}
.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.lede{font-family:var(--serif);font-size:1.3rem;line-height:1.35;color:var(--muted);max-width:60ch;margin:0}
.lede em{color:var(--ink)}

/* ---------- norm tags ---------- */
.tag{display:inline-flex;align-items:baseline;gap:4px;font-family:var(--mono);font-size:.7rem;line-height:1;padding:4px 6px;border-radius:2px;background:var(--c-bg);color:var(--c);border:1px solid transparent;white-space:nowrap}
.tag b{font-weight:600;letter-spacing:.04em}
.tag.x{background:transparent;border:1px dashed var(--c)}
.c-CPR{--c:var(--cpr);--c-bg:var(--cpr-bg)} .c-COT{--c:var(--cot);--c-bg:var(--cot-bg)} .c-CPC{--c:var(--cpc);--c-bg:var(--cpc-bg)}
.c-CC{--c:var(--cc);--c-bg:var(--cc-bg)} .c-NCPP{--c:var(--pp);--c-bg:var(--pp-bg)} .c-OTH{--c:var(--oth);--c-bg:var(--oth-bg)}
.tags{display:flex;flex-wrap:wrap;gap:4px}

/* ---------- radial explorer ---------- */
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px}
.stage-meta{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}
.stage-meta .eyebrow{font-size:.62rem}
#radial{display:block;width:100%;height:auto;max-height:calc(100vh - 190px);margin:0 auto;overflow:visible}
#radial text{font-family:var(--sans)}
.rings circle{fill:none;stroke:var(--ink)}
.scale line{stroke:var(--ink)}
.sector{cursor:pointer}
.sector path.fill{fill:var(--surface);stroke:var(--line);stroke-width:1;transition:fill .25s,stroke .25s}
.sector:hover path.fill{fill:var(--blue-soft)}
.sector.on path.fill{fill:var(--blue);stroke:var(--blue)}
.sector text{font-family:var(--mono)!important;font-size:12.5px;letter-spacing:3px;fill:var(--ink);transition:fill .25s;pointer-events:none}
.sector .no{font-size:10px;letter-spacing:1.5px;fill:var(--muted)}
.sector.on text{fill:var(--on-accent)}
.sector:focus-visible{outline:none}
.sector:focus-visible path.fill{stroke:var(--red);stroke-width:2}
.center{cursor:pointer}
.center .disc{fill:var(--surface);stroke:var(--ink);stroke-width:1}
.center text{text-anchor:middle;pointer-events:none}
.center .ct{font-family:var(--serif)!important;font-size:30px;fill:var(--ink)}
.center .cs{font-family:var(--mono)!important;font-size:10px;letter-spacing:3px;fill:var(--muted)}
.fan line{stroke:var(--ink);stroke-width:.5;opacity:.28;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .7s ease-out forwards;animation-delay:calc(var(--i) * 18ms)}
.garc{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:.55}
.glab{font-family:var(--mono)!important;font-size:9px;letter-spacing:2px;fill:var(--muted)}
.cn{cursor:pointer;opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,.8,.3,1.2) forwards;animation-delay:calc(120ms + var(--i) * 22ms)}
.cn .dot{fill:var(--surface);stroke:var(--ink);stroke-width:1.2;transition:r .2s,fill .2s,stroke .2s}
.cn .hit{fill:transparent}
.cn text{font-size:13px;fill:var(--ink);transition:fill .2s}
.cn:hover .dot,.cn:focus-visible .dot{fill:var(--blue);stroke:var(--blue);r:7}
.cn:hover text,.cn:focus-visible text{fill:var(--blue)}
.cn:focus,.cn:focus-visible,.sector:focus,.center:focus{outline:none}
.cn.rel .dot{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.6}
.cn.rel text{fill:var(--blue)}
.cn.sel .dot{fill:var(--red);stroke:var(--red);r:8}
.cn.sel text{fill:var(--red);font-weight:600}
.cn.dim{opacity:.22!important;animation:none}
.links path{fill:none;stroke:var(--blue);stroke-width:1.3;opacity:.7;stroke-dasharray:600;stroke-dashoffset:600;animation:draw .8s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.6)}to{opacity:1;transform:none}}
.hint{display:flex;gap:18px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);padding:8px 8px 2px}
.hint span{display:inline-flex;align-items:center;gap:6px}
.hint i{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.2px solid var(--ink);background:var(--surface)}
.hint i.s{background:var(--red);border-color:var(--red)}
.hint i.r{background:var(--blue-soft);border-color:var(--blue)}
.mnav{display:flex;gap:6px;flex-wrap:wrap}
.mbtn{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.mbtn small{font-family:var(--mono);font-size:.64rem;color:var(--muted);letter-spacing:.08em}
.mbtn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.mbtn[aria-pressed="true"] small{color:var(--on-accent);opacity:.75}

/* ---------- panel ---------- */
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 124px);max-height:calc(100vh - 144px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.p-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;position:sticky;top:0;background:var(--surface);z-index:1}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{border:0;background:none;padding:0;font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);cursor:pointer}
.x-btn{border:1px solid var(--line);background:var(--paper);border-radius:3px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;flex:none}
.x-btn svg{width:13px;height:13px;stroke:currentColor;fill:none}
.p-head h2{font-family:var(--serif);font-size:2.1rem;line-height:1.02}
.p-body{padding:4px 22px 24px}
.p-sec{padding:16px 0;border-bottom:1px solid var(--line)}
.p-sec:last-child{border-bottom:0}
.p-sec>.eyebrow{display:block;margin-bottom:10px}
.def{font-family:var(--serif);font-size:1.28rem;line-height:1.38;margin:0}
.quote{margin:0 0 12px;padding-left:14px;border-left:2px solid var(--red)}
.quote:last-child{margin-bottom:0}
.quote p{font-family:var(--serif);font-style:italic;font-size:1.12rem;line-height:1.38;margin:0 0 6px}
.quote cite{font-style:normal;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.nlist{display:flex;flex-direction:column;gap:7px}
.nitem{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;font-size:.84rem;color:var(--muted)}
.subs{display:flex;flex-direction:column;gap:6px}
.sub{border:1px solid var(--line);border-radius:3px;background:var(--paper)}
.sub>summary{cursor:pointer;padding:9px 11px;font-weight:500;font-size:.9rem;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sub>summary::-webkit-details-marker{display:none}
.chev{width:14px;height:14px;stroke:var(--muted);fill:none;transition:transform .2s;flex:none}
details[open]>summary .chev{transform:rotate(180deg)}
.sub .sb{padding:0 11px 11px;font-size:.87rem;display:flex;flex-direction:column;gap:6px}
.sub .sb p{margin:0}
.sub .sub{background:var(--surface)}
.leaf{padding:8px 11px;border:1px solid var(--line);border-radius:3px;background:var(--paper);font-size:.87rem}
.leaf b{display:block;font-weight:600;font-size:.88rem;margin-bottom:1px}
.ojo{background:var(--red-soft);border-radius:3px;padding:11px 13px;font-size:.87rem}
.ojo b{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);display:block;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:5px 9px;font-size:.8rem;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.chip small{font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.par{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.mod-desc{font-family:var(--serif);font-size:1.2rem;line-height:1.35;color:var(--muted);margin:0}
.glist{display:flex;flex-direction:column;gap:2px}
.gname{font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.gname:first-child{margin-top:0}
.citem{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:start;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer;width:100%}
.citem:hover .ct{color:var(--blue)}
.citem .d{width:9px;height:9px;border-radius:50%;border:1.2px solid var(--ink);margin-top:6px}
.citem .ct{font-family:var(--serif);font-size:1.12rem;line-height:1.2}
.citem .tags{margin-top:4px}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.ghost{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:6px 10px;font-size:.8rem;cursor:pointer}
.ghost:hover{border-color:var(--blue)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.84rem;color:var(--muted)}
.legend div{display:flex;gap:10px;align-items:center}
.mob-list{display:none}
.scrim{display:none}

/* ---------- other views ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.sectitle{font-family:var(--serif);font-size:1.7rem;line-height:1.1}
.strata{padding:26px 22px;display:flex;flex-direction:column;gap:16px}
.stratum{display:grid;grid-template-columns:190px 1fr;gap:18px;align-items:center;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.stratum .lab{display:flex;flex-direction:column;gap:2px}
.stratum .lab b{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.stratum .lab small{font-size:.8rem;color:var(--muted)}
.bars{height:48px;display:flex;justify-content:center;gap:10px}
.bar{height:100%;flex:0 1 auto;background:repeating-linear-gradient(90deg,var(--blue) 0 1.2px,transparent 1.2px var(--gap,6px));transition:opacity .2s;border-radius:0;opacity:.85}
.stratum:hover .bar,.stratum:focus-visible .bar{opacity:1;filter:saturate(1.3)}
.stratum.on .bar{background:repeating-linear-gradient(90deg,var(--red) 0 1.2px,transparent 1.2px var(--gap,6px))}
.bar.acc{background:repeating-linear-gradient(90deg,var(--blue) 0 1px,transparent 1px var(--gap,6px));opacity:.45}
.aside-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.box .eyebrow{font-size:.62rem}
.mini{display:flex;flex-wrap:wrap;gap:5px}
.mini button{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:4px 8px;font-size:.8rem;cursor:pointer}
.mini button:hover{border-color:var(--blue);color:var(--blue)}
.mini .no{border-style:dashed}
.flowgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
.flow{display:flex;flex-direction:column}
.step{position:relative;padding-left:46px;padding-bottom:18px}
.step::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:1px;background:var(--ink);opacity:.5}
.step:last-child::before{display:none}
.step .n{position:absolute;left:0;top:0;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.74rem;background:var(--paper);border:1px solid var(--ink)}
.step.done .n{background:var(--ink);color:var(--paper)}
.step.cur .n{border:2px solid var(--blue);color:var(--blue)}
.step.res .n{background:var(--red);border-color:var(--red);color:var(--on-accent)}
.sbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:13px 15px;display:flex;flex-direction:column;gap:8px}
.step.cur .sbox{border-color:var(--blue)}
.step.res .sbox{border-color:var(--red)}
.sbox .q{font-family:var(--serif);font-size:1.35rem;line-height:1.2}
.sbox .ans{font-size:.86rem;color:var(--muted)}
.sbox .ans b{color:var(--ink);font-weight:600}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--blue);background:var(--surface);color:var(--blue);border-radius:3px;padding:7px 12px;cursor:pointer;font-size:.86rem;font-weight:500}
.opt:hover{background:var(--blue);color:var(--on-accent)}
.link{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.84rem;text-align:left}
.ov{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:13px 15px;display:flex;flex-direction:column;gap:8px}
.ov h3{font-family:var(--serif);font-size:1.25rem}
.ov ol{margin:0;padding-left:18px;font-size:.87rem;display:flex;flex-direction:column;gap:3px}
.stack{display:flex;flex-direction:column;gap:10px}
.proc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.cmpnav{display:flex;flex-wrap:wrap;gap:5px}
.cmpnav button{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:5px 10px;font-size:.82rem;cursor:pointer}
.cmpnav button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cmp-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.cmp-h h2{font-family:var(--serif);font-size:1.9rem;line-height:1.05}
.cmp-h p{margin:0;color:var(--muted);font-size:.92rem}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.88rem}
th,td{padding:11px 16px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{font-family:var(--serif);font-size:1.3rem;font-weight:400;cursor:pointer;background:var(--paper)}
thead th:hover{color:var(--blue)}
thead th:first-child{cursor:default;font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);width:150px}
thead th .tags{margin-top:6px}
tbody th{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
.authors{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.author{padding:18px;display:flex;flex-direction:column;gap:10px}
.author h3{font-family:var(--serif);font-size:1.6rem;line-height:1.05}
.author blockquote{margin:0;font-family:var(--serif);font-style:italic;font-size:1.1rem;line-height:1.38;border-left:2px solid var(--red);padding-left:12px}
.keys{padding:16px 20px}
.keys ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}

@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr)}

function searchHits(q){
  q = q.trim().toLowerCase(); if (!q) return [];
  const words = q.split(/\s+/);
  return Object.keys(N).map(id => {
    const n = N[id];
    const hay = [n.t, n.k, n.d, (n.n||[]).join(" "), (n.doc||[]).map(d=>d.join(" ")).join(" "), JSON.stringify(n.sub||[]), n.ojo||""].join(" ").toLowerCase();
    if (!words.every(w => hay.includes(w))) return null;
    return [id, n.t.toLowerCase().includes(q) ? 0 : 1];
  }).filter(Boolean).sort((a,b)=>a[1]-b[1]).slice(0,12).map(x=>x[0]);
}

}

const C = 550, R_IN = 118, R_S0 = 150, R_S1 = 244, R_TRACK = 300, R_G = 322, R_N = 346, R_L = 362;
const P = (r, a) => [C + r*Math.cos(a*Math.PI/180), C + r*Math.sin(a*Math.PI/180)];
const f = n => n.toFixed(2);
function arcPath(r, a0, a1, sweep=1){ const [x0,y0]=P(r,a0),[x1,y1]=P(r,a1); return `M${f(x0)},${f(y0)} A${r},${r} 0 ${Math.abs(a1-a0)>180?1:0} ${sweep} ${f(x1)},${f(y1)}`; }
function sectorPath(a0,a1){
  const [x0,y0]=P(R_S1,a0),[x1,y1]=P(R_S1,a1),[x2,y2]=P(R_S0,a1),[x3,y3]=P(R_S0,a0);
  return `M${f(x0)},${f(y0)} A${R_S1},${R_S1} 0 0 1 ${f(x1)},${f(y1)} L${f(x2)},${f(y2)} A${R_S0},${R_S0} 0 0 0 ${f(x3)},${f(y3)}Z`;
}
function staticLayer(){
  let s = `<g class="rings">`;
  for (let r = 8; r <= R_IN; r += 5.5) s += `<circle cx="${C}" cy="${C}" r="${f(r)}" stroke-width="${r+5.5>R_IN?1:.45}" opacity="${r+5.5>R_IN?.9:(.12+.3*r/R_IN).toFixed(2)}"/>`;
  s += `</g><g class="scale">`;
  for (let k = 0; k < 120; k++){
    const a = k*3 - 90, L = k%10===0; const [x0,y0]=P(R_S1+8,a),[x1,y1]=P(R_S1+(L?22:15),a);
    s += `<line x1="${f(x0)}" y1="${f(y0)}" x2="${f(x1)}" y2="${f(y1)}" stroke-width="${L?.9:.45}" opacity="${L?.8:.4}"/>`;
  }
  s += `</g><defs>`;
  MODS.forEach((m,i) => {
    const a0 = i*45 - 112.5 + 1.2, a1 = a0 + 45 - 2.4, mid = (a0+a1)/2, bottom = mid > 0 && mid < 180;
    const r = (R_S0+R_S1)/2 + (bottom ? 12 : -4), r2 = r + (bottom ? -20 : 18);
    s += `<path id="sl${i}" d="${bottom ? arcPath(r,a1,a0,0) : arcPath(r,a0,a1,1)}"/><path id="sn${i}" d="${bottom ? arcPath(r2,a1,a0,0) : arcPath(r2,a0,a1,1)}"/>`;
  });
  s += `</defs><g id="sectors">`;
  MODS.forEach((m,i) => {
    const a0 = i*45 - 112.5 + 1.2, a1 = a0 + 45 - 2.4;
    s += `<g class="sector" data-mod="${m.id}" tabindex="0" role="button" aria-label="Tema ${i+1}: ${esc(m.t)}"><path class="fill" d="${sectorPath(a0,a1)}"/>
      <text><textPath href="#sl${i}" startOffset="50%" text-anchor="middle">${MODNAME[m.id]}</textPath></text>
      <text class="no"><textPath href="#sn${i}" startOffset="50%" text-anchor="middle">${String(i+1).padStart(2,"0")}</textPath></text></g>`;
  });
  s += `</g><g class="center" id="center" tabindex="0" role="button" aria-label="Ver el tema actual"><circle class="disc" cx="${C}" cy="${C}" r="${R_IN-40}" opacity="0"/><g id="centerText"></g></g>
  <g id="dyn"></g>`;
  return s;
}
function wrapWords(t, max){ const out=[]; let line=""; for (const w of t.split(" ")){ if ((line+" "+w).trim().length>max && line){ out.push(line); line=w; } else line=(line+" "+w).trim(); } if (line) out.push(line); return out; }
function centerLayer(){
  const m = MODS.find(x=>x.id===state.mod);
  const lines = wrapWords(m.t.replace(/,.*$/,""), 13).slice(0,3);
  const y0 = C - (lines.length-1)*15 + 6;
  return `<rect x="${C-100}" y="${C-70}" width="200" height="140" fill="var(--surface)" opacity=".86" rx="4"/>
    <text class="cs" x="${C}" y="${y0-34}">TEMA ${m.no}</text>` +
    lines.map((l,i)=>`<text class="ct" x="${C}" y="${y0+i*30}">${esc(l)}</text>`).join("") +
    `<text class="cs" x="${C}" y="${y0+lines.length*30+4}">${modIds(m).length} CONCEPTOS</text>`;
}
function dynLayer(){
  const m = MODS.find(x=>x.id===state.mod), mi = MODS.indexOf(m);
  const ids = modIds(m), n = ids.length;
  const GAP = 3.2, groups = m.groups.length, step = (360 - GAP*groups) / n;
  const angle = {}; // el anillo de conceptos arranca opuesto al sector elegido, así el centro de la lista queda junto a él
  let a = (mi*45 - 90) - 180 + step/2, k = 0;
  let garcs = "", nodes = "", fan = "";
  m.groups.forEach(([gt, gids]) => {
    const g0 = a - step/2 + .6;
    gids.forEach(id => {
      angle[id] = a;
      const [x,y] = P(R_N, a), [dx,dy] = [f((C-x)*.25), f((C-y)*.25)];
      const norm = ((a % 360) + 360) % 360, left = norm > 90 && norm < 270;
      const rot = left ? norm + 180 : norm, [lx,ly] = P(R_L, a);
      const cls = ["cn"]; if (state.sel===id) cls.push("sel"); else if (state.sel && isRel(state.sel,id)) cls.push("rel"); if (!passes(id)) cls.push("dim");
      nodes += `<g class="${cls.join(" ")}" data-id="${id}" tabindex="0" role="button" aria-label="${esc(N[id].t)}" style="--i:${k};--dx:${dx}px;--dy:${dy}px">
        <circle class="hit" cx="${f(x)}" cy="${f(y)}" r="14"/><circle class="dot" cx="${f(x)}" cy="${f(y)}" r="5.5"/>
        <text x="${f(lx)}" y="${f(ly)}" dy="4.3" text-anchor="${left?"end":"start"}" transform="rotate(${f(rot)} ${f(lx)} ${f(ly)})">${esc(short(id))}</text></g>`;
      const [fx,fy] = P(R_N-9, a), [ex,ey] = P(R_S1+30, a);
      fan += `<line x1="${f(ex)}" y1="${f(ey)}" x2="${f(fx)}" y2="${f(fy)}" style="--i:${k}"/>`;
      a += step; k++;
    });
    const g1 = a - step/2 - .6;
    garcs += `<path class="garc" d="${arcPath(R_G, g0, g1)}"/>`;
    a += GAP;
  });
  let links = "";
  if (state.sel && angle[state.sel] !== undefined){
    let lane = 0;
    ids.filter(id => id!==state.sel && isRel(state.sel,id)).forEach(id => {
      let a0 = angle[state.sel], a1 = angle[id]; if (a1 < a0) [a0,a1] = [a1,a0];
      const r = R_TRACK - lane*7; lane++;
      const [p0x,p0y]=P(R_N-8,a0), [p1x,p1y]=P(R_N-8,a1), [q0x,q0y]=P(r,a0), [q1x,q1y]=P(r,a1);
      links += `<path d="M${f(p0x)},${f(p0y)} L${f(q0x)},${f(q0y)} A${r},${r} 0 ${a1-a0>180?1:0} 1 ${f(q1x)},${f(q1y)} L${f(p1x)},${f(p1y)}"/>`;
    });
  }
  return `<g class="fan">${fan}</g><g>${garcs}</g><g class="links">${links}</g>${nodes}`;
}
function isRel(a,b){ return (N[a].r||[]).includes(b) || (N[b].r||[]).includes(a); }

  if (state.sel && MOD_OF[state.sel] !== state.mod){ state.mod = MOD_OF[state.sel]; store.set("mod",state.mod); }

    <div class="hint"><span><i></i>Concepto</span><span><i class="s"></i>Seleccionado</span><span><i class="r"></i>Conectado</span><span>Los arcos exteriores agrupan subtemas</span></div>

function markSelection(){

    const id = g.dataset.id; g.style.animation = "none"; g.style.opacity = "1";
    g.classList.toggle("sel", state.sel===id);
    g.classList.toggle("rel", !!state.sel && state.sel!==id && isRel(state.sel,id));
  });
  // redibujar solo los enlaces
  const tmp = document.createElementNS("http://www.w3.org/2000/svg","g"); tmp.innerHTML = dynLayer();
  const old = document.querySelector("#dyn .links"), nu = tmp.querySelector(".links"); if (old && nu) old.replaceWith(nu);
}
function setMod(id){
  if (!MODS.some(m=>m.id===id)) return;
  const changed = state.mod !== id; state.mod = id; store.set("mod", id);
  if (state.sel && MOD_OF[state.sel] !== id) state.sel = null;
  if (changed || !document.querySelector("#dyn .cn")) refreshRadial(); else markSelection();
  renderPanel();
}

/* =========================================================
   PANEL
   ========================================================= */
function moduleBody(m){
  const i = MODS.indexOf(m);
  return `<div class="glist">${m.groups.map(([gt,ids]) => `<div class="gname">${esc(gt)}</div>` + ids.map(id => `<button class="citem" data-id="${id}"${passes(id)?"":` style="opacity:.35"`}><span class="d"></span><span><span class="ct">${esc(N[id].t)}</span><span class="tags">${(N[id].n||[]).slice(0,3).map(tag).join("")}</span></span></button>`).join("")).join("")}</div>
  <div class="pager"><button class="ghost" data-mod="${MODS[(i+7)%8].id}">← ${esc(MODNAME[MODS[(i+7)%8].id])}</button><button class="ghost" data-mod="${MODS[(i+1)%8].id}">${esc(MODNAME[MODS[(i+1)%8].id])} →</button></div>`;
}
function subHTML(list, depth=0){
  return `<div class="subs">${list.map(([t,d,ch]) => ch && ch.length
    ? `<details class="sub"${depth===0 && list.length<=3?" open":""}><summary>${esc(t)}${chev}</summary><div class="sb">${d?`<p>${esc(d)}</p>`:""}${subHTML(ch, depth+1)}</div></details>`
    : `<div class="leaf"><b>${esc(t)}</b>${d?esc(d):""}</div>`).join("")}</div>`;
}
function normNote(s){
  const p = parseNorm(s);
  const name = p.x ? "Complementaria: no citada en el apunte." : ({CPR:"Constitución Política de la República",COT:"Código Orgánico de Tribunales",CPC:"Código de Procedimiento Civil",CC:"Código Civil",NCPP:"Código Procesal Penal"}[p.cls] || (p.code==="LERL"?"Ley sobre Efecto Retroactivo de las Leyes":"Ley especial"));
  return `<div class="nitem">${tag(s)}<span>${name}</span></div>`;
}
const closeBtn = `<button class="x-btn" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;
function renderPanel(){
  const p = $("#panel"), id = state.sel;
  if (!id){
    p.classList.remove("open"); $("#scrim").classList.remove("open");
    if (state.tab === "explorar"){
      const m = MODS.find(x=>x.id===state.mod);
      p.innerHTML = `<div class="p-head"><span class="eyebrow">Tema ${esc(m.no)} · ${modIds(m).length} conceptos</span><h2>${esc(m.t)}</h2></div><div class="p-body"><section class="p-sec"><p class="mod-desc">${esc(m.d)}</p></section><section class="p-sec">${moduleBody(m)}</section></div>`;
    } else {
      p.innerHTML = `<div class="p-head"><span class="eyebrow">Ficha</span><h2>Selecciona un concepto</h2></div><div class="p-body"><section class="p-sec"><p class="mod-desc">Aquí verás su definición, doctrina, artículos, subclasificaciones y conexiones.</p></section><section class="p-sec"><div class="legend">${CODES.map(([c,name])=>`<div><span class="tag c-${c}"><b>${LABEL[c]}</b></span>${esc(name)}</div>`).join("")}<div><span class="tag c-COT x"><b>COT</b>Art. …</span>Borde punteado: referencia complementaria</div></div></section></div>`;
    }
    return;
  }
  const n = N[id], mod = MODS.find(x=>x.id===MOD_OF[id]);
  const pars = CMP.filter(c => (n.par||[]).includes(c.id));
  const rel = [...new Set((n.r||[]).concat(Object.keys(N).filter(k => k!==id && (N[k].r||[]).includes(id))))].filter(x => N[x]).slice(0,12);
  p.innerHTML = `<div class="p-head"><div class="p-top"><button class="back" data-mod="${mod.id}" data-back>← ${esc(MODNAME[mod.id])}</button>${closeBtn}</div><span class="eyebrow">${esc(n.k)}</span><h2>${esc(n.t)}</h2><div class="tags">${(n.n||[]).map(tag).join("")}</div></div>
  <div class="p-body">
    <section class="p-sec"><span class="eyebrow">Definición</span><p class="def">${esc(n.d)}</p></section>
    ${n.doc?`<section class="p-sec"><span class="eyebrow">Doctrina</span>${n.doc.map(([a,q])=>`<figure class="quote"><p>“${esc(q)}”</p><cite>${esc(a)}</cite></figure>`).join("")}</section>`:""}
    <section class="p-sec"><span class="eyebrow">Respaldo normativo</span><div class="nlist">${(n.n||[]).map(normNote).join("")}</div></section>
    ${n.sub?`<section class="p-sec"><span class="eyebrow">Subclasificaciones y contenido</span>${subHTML(n.sub)}</section>`:""}
    ${n.ojo?`<section class="p-sec"><div class="ojo"><b>Ojo en el examen</b>${esc(n.ojo)}</div></section>`:""}
    ${pars.length?`<section class="p-sec"><span class="eyebrow">Paralelos</span><div class="chips">${pars.map(c=>`<button class="chip par" data-cmp="${c.id}">${esc(c.t)}</button>`).join("")}</div></section>`:""}
    ${rel.length?`<section class="p-sec"><span class="eyebrow">Se conecta con</span><div class="chips">${rel.map(x=>`<button class="chip" data-id="${x}">${esc(N[x].t)}${MOD_OF[x]!==MOD_OF[id]?`<small>${MODNAME[MOD_OF[x]]}</small>`:""}</button>`).join("")}</div></section>`:""}
  </div>`;
  p.scrollTop = 0;
  if (mobile()){ p.classList.add("open"); $("#scrim").classList.add("open"); }
}
function select(id){
  if (!N[id]) return;
  state.sel = id;
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  if (state.tab === "explorar"){
    if (MOD_OF[id] !== state.mod){ state.mod = MOD_OF[id]; store.set("mod",state.mod); refreshRadial(); }
    else markSelection();
  }
  renderPanel();
}
function closePanel(){
  state.sel = null; renderPanel();
  if (state.tab === "explorar") markSelection();
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
}

/* =========================================================
   TRIBUNALES
   ========================================================= */
function renderTribunales(){
  const S = (id, name, sub, bars) => `<button class="stratum${state.sel===id?" on":""}" data-id="${id}"><span class="lab"><b>${name}</b><small>${sub}</small></span><span class="bars">${bars}</span></button>`;
  const bar = (w, gap, cls="") => `<span class="bar ${cls}" style="width:${w};--gap:${gap}px"></span>`;
  return `<p class="lede">La pirámide del <em>Art. 5 COT</em>, dibujada como estratos: pocas marcas arriba, un campo denso en la base. Toca un estrato para abrir su ficha.</p>
  <section class="card strata">
    ${S("cs","Corte Suprema","21 ministros · superintendencia", bar("126px",6))}
    ${S("ca","Cortes de Apelaciones","17 · segunda instancia", bar("45%",26))}
    ${S("unipersonales","Unipersonales de excepción","accidentales · por fuero o materia", bar("24%",10,"acc"))}
    ${S("jletras","Jueces de Letras","civil · unipersonales", bar("100%",4))}
    ${S("jgarantia","Juzgados de Garantía","penal · investigación", bar("100%",4))}
    ${S("top","Juicio Oral en lo Penal","penal · salas de 3", bar("100%",4))}
  </section>
  <div class="aside-grid">
    <div class="box"><span class="eyebrow">Especiales · parte del Poder Judicial</span><div class="mini">${["Familia","Letras del Trabajo","Cobranza Laboral y Previsional","Militares (paz)"].map(x=>`<button data-id="especiales">${x}</button>`).join("")}</div></div>
    <div class="box"><span class="eyebrow">Especiales · fuera del Poder Judicial</span><div class="mini">${["Policía Local","Militares (guerra)","Contraloría","TDLC","Director SII","Director Aduanas","Tribunal de Marcas","Alcaldes"].map(x=>`<button class="no" data-id="especiales">${x}</button>`).join("")}</div></div>
    <div class="box"><span class="eyebrow">Arbitrales · Art. 222 COT</span><div class="mini">${["De derecho","Arbitrador","Mixto"].map(x=>`<button data-id="arbclasesfallo">${x}</button>`).join("")}</div></div>
  </div>
  <h2 class="sectitle">Clasificaciones</h2>
  <div class="aside-grid">${N.clasiftrib.sub.map(([t,,ch]) => `<div class="box"><span class="eyebrow">${esc(t)}</span>${(ch||[]).map(([a,b])=>`<div style="font-size:.88rem"><b style="font-weight:600">${esc(a)}.</b> <span style="color:var(--muted)">${esc(b)}</span></div>`).join("")}</div>`).join("")}</div>
  <h2 class="sectitle">Tramitación en tribunales colegiados</h2>
  <div class="mini">${["cuentavista","vistacausa","acuerdos","discordia","subrogacion","integracion"].map(id=>`<button data-id="${id}" style="font-size:.9rem;padding:7px 11px">${esc(N[id].t)}</button>`).join("")}</div>`;
}

/* =========================================================
   DESCARTE
   ========================================================= */
function renderDescarte(){
  let steps = "";
  state.path.forEach((key, i) => {
    const s = FLOW[key], done = i < state.path.length - 1;
    if (s.res){
      steps += `<div class="step res"><span class="n">✓</span><div class="sbox"><span class="eyebrow" style="color:var(--red)">Tribunal competente</span><span class="q">${esc(s.res)}</span>${s.txt?`<span class="ans">${esc(s.txt)}</span>`:""}<span class="tags">${s.n.map(tag).join("")}</span><span class="ans">${esc(AFTER)}</span><div class="opts"><button class="link" data-id="${s.node}">Ver ficha</button><button class="link" data-id="distribucion">Distribución de causas</button><button class="link" data-flow="reset">Reiniciar</button></div></div></div>`;
      return;
    }
    steps += `<div class="step ${done?"done":"cur"}"><span class="n">${i+1}</span><div class="sbox"><span class="eyebrow">${esc(s.lbl)}</span><span class="q">${esc(s.q)}</span>${done
      ? `<span class="ans">Respuesta: <b>${esc(state.ans[i])}</b> · <button class="link" data-flow="back" data-i="${i}">cambiar</button></span>`
      : `<span class="ans">${esc(s.hint)}</span><span class="tags">${s.n.map(tag).join("")}</span><div class="opts">${s.opts.map(([t,to])=>`<button class="opt" data-flow="go" data-to="${to}" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div><button class="link" data-id="${s.node}">Ver ficha del concepto</button>`}</div></div>`;
  });
  const ov = [["1. ¿Hay arbitraje?",["Forzoso → árbitro.","Prohibido → sigue al paso 2.","Facultativo con compromiso o cláusula → árbitro."],["COT 227","COT 229","COT 230"]],
    ["2. ¿Hay tribunal especial?",["Familia, Trabajo, Policía Local, etc."],["COT 5"]],
    ["3. Competencia absoluta",["Cuantía, materia, fuero (tiempo en penal).","Fija la jerarquía del tribunal."],["COT 115"]],
    ["4. Competencia relativa",["Civil contencioso: prórroga → regla especial → naturaleza de la acción → domicilio del demandado.","No contencioso: regla especial → domicilio del solicitante.","Penal: lugar del hecho."],["COT 134","COT 135","COT 139"]],
    ["5. Varios competentes en el mismo lugar",["Distribución de causas (asiento de Corte) o turno."],["COT 175","COT 178"]]];
  return `<p class="lede">Las reglas de descarte van de <em>lo especial a lo general</em>. Responde cada pregunta y el flujo te lleva al tribunal competente, con la norma de cada paso.</p>
  <div class="flowgrid"><section><h2 class="sectitle" style="margin-bottom:14px">Simulador</h2><div class="flow">${steps}</div></section>
  <aside><h2 class="sectitle" style="margin-bottom:14px">Secuencia completa</h2><div class="stack">${ov.map(([t,l,n])=>`<div class="ov"><h3>${esc(t)}</h3><ol>${l.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><div class="tags">${n.map(tag).join("")}</div></div>`).join("")}</div></aside></div>
  <h2 class="sectitle">Procedimiento aplicable</h2>
  <div class="proc">${PROC.map(([t,st,n]) => `<div class="ov"><h3>${esc(t)}</h3><ol>${st.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><div class="tags">${n.map(tag).join("")}</div></div>`).join("")}</div>`;
}
function flowAct(b){
  const a = b.dataset.flow;
  if (a === "reset"){ state.path=["a1"]; state.ans=[]; }
  else if (a === "back"){ const i=+b.dataset.i; state.path=state.path.slice(0,i+1); state.ans=state.ans.slice(0,i); }
  else if (a === "go"){ state.ans.push(b.dataset.t); state.path.push(b.dataset.to); const last = FLOW[b.dataset.to]; if (last.node && !mobile()){ state.sel = last.node; renderPanel(); } }
  renderMain();
}

/* =========================================================
   PARALELOS Y DOCTRINA
   ========================================================= */
function renderParalelos(){
  const c = CMP.find(x => x.id === state.cmp) || CMP[0];
  const head = c.rowHead
    ? `<tr><th>Auxiliar</th>${c.cols.map(([t])=>`<th style="cursor:default">${esc(t)}</th>`).join("")}</tr>`
    : `<tr><th>Criterio</th>${c.cols.map(([t,id,n])=>`<th data-id="${id}" title="Abrir ficha">${esc(t)}<div class="tags">${n.map(tag).join("")}</div></th>`).join("")}</tr>`;
  return `<p class="lede">Los paralelos que más se preguntan, <em>lado a lado</em>. Toca el encabezado de una columna para abrir la ficha.</p>
  <section class="card keys"><span class="eyebrow" style="color:var(--red)">Repaso de oro</span><ol>${KEYS.map(k => `<li><b style="font-weight:600">${esc(k[0])}:</b> ${esc(k[1])}</li>`).join("")}</ol></section>
  <div class="cmpnav">${CMP.map(x=>`<button data-cmpsel="${x.id}" aria-pressed="${x.id===c.id}">${esc(x.t)}</button>`).join("")}</div>
  <section class="card"><div class="cmp-h"><h2>${esc(c.t)}</h2><p>${esc(c.d)}</p></div>
  <div class="tblw"><table><thead>${head}</thead><tbody>${c.rows.map(r=>`<tr><th scope="row">${esc(r[0])}</th>${r.slice(1).map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`;
}
function renderDoctrina(){
  const map = new Map();
  for (const [id,n] of Object.entries(N)) for (const [a,q] of (n.doc||[])){
    if (a.startsWith("Concepto legal") || a.startsWith("Crítica")) continue;
    if (!map.has(a)) map.set(a, []); map.get(a).push([id,q]);
  }
  return `<p class="lede">Cada autor que cita el apunte, con su definición y el <em>concepto</em> al que se vincula.</p>
  <div class="authors">${[...map.keys()].map(a => `<article class="card author"><span class="eyebrow">Doctrina</span><h3>${esc(a)}</h3>${map.get(a).map(([id,q])=>`<blockquote>“${esc(q)}”</blockquote><div><button class="chip" data-id="${id}">${esc(N[id].t)}</button></div>`).join("")}</article>`).join("")}
  <article class="card author"><span class="eyebrow">Ley vs. doctrina</span><h3>La definición del Art. 108 COT</h3><blockquote>“${esc(N.competencia.doc[0][1])}”</blockquote><p style="margin:0;font-size:.9rem;color:var(--muted)">${esc(N.competencia.doc[1][1])} Concepto correcto: esfera, grado o medida establecida por el legislador para que cada tribunal ejerza jurisdicción.</p><div><button class="chip" data-id="competencia">Competencia</button></div></article></div>`;
}

function renderMain(){
  const r = {explorar:renderExplorar, tribunales:renderTribunales, descarte:renderDescarte, paralelos:renderParalelos, doctrina:renderDoctrina}[state.tab] || renderExplorar;
  $("#main").innerHTML = r();
  if (state.tab === "explorar") refreshRadial();
}

/* =========================================================
   EVENTOS
   ========================================================= */
document.addEventListener("click", e => {
  const t = e.target;
  if (!t.closest("#searchbox")) $("#results").hidden = true;
  const go = t.closest("[data-go]"); if (go){ $("#results").hidden = true; $("#q").value = ""; if (state.tab!=="explorar"){ state.tab="explorar"; store.set("tab","explorar"); renderTabs(); renderMain(); } select(go.dataset.go); window.scrollTo({top:0,behavior:"smooth"}); return; }
  const tb = t.closest("[data-tab]"); if (tb){ setTab(tb.dataset.tab); return; }
  const fb = t.closest(".fbtn"); if (fb){ const c = fb.dataset.code; state.codes.has(c) ? state.codes.delete(c) : state.codes.add(c); renderFilters(); if (state.tab==="explorar") refreshRadial(); renderPanel(); return; }
  const fl = t.closest("[data-flow]"); if (fl){ flowAct(fl); return; }
  const cm = t.closest("[data-cmp]"); if (cm){ state.cmp = cm.dataset.cmp; store.set("cmp",state.cmp); if (mobile()) closePanel(); setTab("paralelos"); return; }
  const cs = t.closest("[data-cmpsel]"); if (cs){ state.cmp = cs.dataset.cmpsel; store.set("cmp",state.cmp); renderMain(); return; }
  const back = t.closest("[data-back]"); if (back){ state.sel = null; if (state.tab!=="explorar"){ setTab("explorar"); } setMod(back.dataset.mod); markSelection(); return; }
  const idb = t.closest("[data-id]"); if (idb && N[idb.dataset.id]){ select(idb.dataset.id); return; }
  if (t.closest("[data-close]") || t.id === "scrim"){ closePanel(); return; }
  if (t.closest("#center")){ state.sel = null; renderPanel(); markSelection(); return; }
  const md = t.closest("[data-mod]"); if (md){ setMod(md.dataset.mod); if (md.classList.contains("ghost") && mobile()) document.querySelector(".mob-list")?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ if (!$("#results").hidden){ $("#results").hidden = true; return; } if (state.sel) closePanel(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".sector,.cn,#center")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); }
  if (state.tab==="explorar" && (e.key==="ArrowRight"||e.key==="ArrowLeft") && !e.target.matches("input")){
    const i = MODS.findIndex(m=>m.id===state.mod); setMod(MODS[(i+(e.key==="ArrowRight"?1:7))%8].id);
  }
});
let qt; $("#q").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(renderResults, 100); });
$("#q").addEventListener("focus", renderResults);
$("#q").addEventListener("keydown", e => { if (e.key==="Enter"){ const b = $("#results button"); if (b) b.click(); } });

/* =========================================================
   INICIO
   ========================================================= */
renderTabs(); renderFilters();
const h = (location.hash||"").slice(1);
if (N[h]){ state.sel = h; state.mod = MOD_OF[h]; }
renderMain(); renderPanel();
</script>
